name: Deploy to VPS (Release)

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: npms.pro
          username: root
          password: RsmMonaem66@@
          script: |
            # Navigate to the project directory on your server
            cd /root/aichat-backend.npms.pro
            
            # Fetch the latest tags and checkout the release tag
            git fetch --tags
            LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
            git checkout $LATEST_TAG
            
            # Rebuild and restart the Docker containers
            docker compose up --build -d
            
            # Clean up dangling images to save space
            docker image prune -f
