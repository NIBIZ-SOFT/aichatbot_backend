name: Deploy to VPS (Main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: npms.pro
          username: root
          password: RsmMonaem66@@
          source: "."
          target: "/home/npms.pro/public_html/aichat-backend.npms.pro/"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: npms.pro
          username: root
          password: RsmMonaem66@@
          script: |
            cd /home/npms.pro/public_html/aichat-backend.npms.pro/
            
            # Rebuild and restart the Docker containers
            docker compose up --build -d
            
            # Clean up dangling images to save space
            docker image prune -f
