name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 147.93.31.214
          username: root
          password: RsmMonaem66@@
          script: |
            # Navigate to the project directory on your server
            # IMPORTANT: Update this path to where your project is located on the VPS!
            cd /root/aichat-backend.npms.pro
            
            # Pull the latest changes from the main branch
            git pull origin main
            
            # Rebuild and restart the Docker containers
            docker compose up --build -d
            
            # Clean up dangling images to save space
            docker image prune -f
