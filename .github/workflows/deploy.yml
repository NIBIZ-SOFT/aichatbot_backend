name: Deploy to VPS (Main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: npms.pro
          username: root
          password: RsmMonaem66@@
          script: |
            # Navigate to the project directory on your server
            # IMPORTANT: Update this path to where your project is located on the VPS!
            cd /home/npms.pro/public_html/aichat-backend.npms.pro/
            
            # Force pull the latest changes from the main branch to ensure the server updates
            git fetch --all
            git reset --hard origin/main
            
            # Rebuild and restart the Docker containers
            docker compose up --build -d
            
            # Clean up dangling images to save space
            docker image prune -f
